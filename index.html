<style>
:root{
  --brand:#139a74; --brand-deep:#0d7a5b; --brand-ink:#04180f; --brand-bright:#6fc5ab; --brand-light:#89d0ba;
  --brand-line:#d4ede5; --brand-tint:#e9f6f2; --on-dark:#95d2c0;
  --hero-1:#03140f; --hero-2:#06241f; --hero-3:#0b3a31;
}


:root{
  --bg:#f4f6fb;
  --surface:#ffffff;
  --surface-2:#eef1f9;
  --border:#dde2f0;
  --text:#1a2036;
  --text-muted:#5c6480;
  --accent:#2f56d6;
  --accent-ink:#16224f;
  --accent-soft:#e4ebff;
  --warn:#b4680a;
  --warn-soft:#fbedd8;
  --danger:#c13a54;
  --danger-soft:#fbe4ea;
  --success:#1c8f5c;
  --success-soft:#e0f5ea;
  --shadow: 0 1px 2px rgba(20,30,70,.06), 0 8px 24px -12px rgba(20,30,70,.12);
  --ink-950:#07080f;
  --ink-850:#141a3d;
  --brand-blue:#3d6fe0;
  --brand-blue-bright:var(--brand-bright);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1220;
    --surface:#161d33;
    --surface-2:#1c2440;
    --border:#2b3457;
    --text:#e8ebf8;
    --text-muted:#9aa2c4;
    --accent:#7b98ff;
    --accent-ink:#dbe4ff;
    --accent-soft:#22305e;
    --warn:#f0ac4c;
    --warn-soft:#3a2c13;
    --danger:#ff8ba0;
    --danger-soft:#3c1a25;
    --success:#5fdba0;
    --success-soft:#123324;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1220;
  --surface:#161d33;
  --surface-2:#1c2440;
  --border:#2b3457;
  --text:#e8ebf8;
  --text-muted:#9aa2c4;
  --accent:#7b98ff;
  --accent-ink:#dbe4ff;
  --accent-soft:#22305e;
  --warn:#f0ac4c;
  --warn-soft:#3a2c13;
  --danger:#ff8ba0;
  --danger-soft:#3c1a25;
  --success:#5fdba0;
  --success-soft:#123324;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.5);
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.navlabel,.stat-label,.tag{font-family:'Oswald',system-ui,sans-serif;}
h1,h2,h3{text-wrap:balance; margin:0;}
.script{font-family:'Caveat',cursive; font-weight:700;}
.star-deco{position:absolute; fill:none; pointer-events:none;}
a{color:var(--accent);}
button{font-family:inherit;}

/* header — fixed dark brand band, independent of viewer theme */










nav.tabs{
  max-width:980px; margin:0 auto;
  display:flex; gap:2px; overflow-x:auto;
  scrollbar-width:none;
  scroll-snap-type:x proximity;
}
nav.tabs::-webkit-scrollbar{display:none;}
nav.tabs button{
  flex:0 0 auto;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  background:none; border:none; border-bottom:2.5px solid transparent; cursor:pointer;
  color:var(--text-muted);
  font-size:11px; font-weight:600; letter-spacing:.01em;
  padding:10px 13px 9px;
  white-space:nowrap;
  scroll-snap-align:center;
}
/* Home stays reachable in one tap no matter how far the tab strip is
   scrolled: pinning it to the scroll container's own left edge (rather than
   leaving it to scroll away like every other tab) means parents several
   tabs deep never have to scroll back before they can get home. Sticky is a
   no-op when the strip isn't scrolling (e.g. desktop), so it never changes
   anything there. */
nav.tabs button[data-tab="home"]{
  position:sticky; left:0; z-index:6; background:var(--surface);
}
.navbar-wrap{position:relative; display:flex; align-items:center;}
/* The scroll arrows live OUTSIDE .tabs-viewport (in normal flex flow) rather
   than floating on top of the scrolling tab strip. An absolutely-positioned
   overlay arrow would otherwise sit on top of whatever real tab button
   happens to be scrolled underneath it, silently swallowing taps meant for
   that tab (this is what made Home, Calendar, etc. unclickable at certain
   scroll positions). Reserving real, non-overlapping space for the arrows
   fixes that at the source. */
.tabs-viewport{position:relative; flex:1 1 auto; min-width:0; overflow:hidden;}
.tab-scroll-fade{
  position:absolute; top:0; bottom:0; width:38px; z-index:5;
  pointer-events:none; opacity:0; transition:opacity .15s ease;
}
.tab-scroll-fade.left{left:0; background:linear-gradient(90deg, var(--surface) 40%, transparent);}
.tab-scroll-fade.right{right:0; background:linear-gradient(270deg, var(--surface) 40%, transparent);}
.navbar-wrap.can-scroll-left .tab-scroll-fade.left,
.navbar-wrap.can-scroll-right .tab-scroll-fade.right{opacity:1;}
/* The outer button is just a reservable flex slot: it holds no border/
   background/shadow of its own, and .tsb-circle (a fixed-size inner span)
   carries all of that. That split is what lets an arrow's whole footprint
   collapse to width:0 when there's nothing left to scroll that way — a
   circle sized in px, or a border/box-shadow painted directly on the outer
   button, cannot be shrunk to truly zero width (borders keep their own
   thickness no matter how small the box gets), so it always left a sliver
   of dead space next to Home or FAQ. Clipping a fixed-size inner circle
   with the outer's overflow:hidden has no such floor — at width:0 nothing
   of it is visible at all. */
.tab-scroll-btn{
  position:relative; flex:0 0 auto; margin:0 4px; z-index:7;
  width:32px; overflow:hidden; padding:0; border:none; background:none; cursor:pointer;
  transition:width .15s ease, margin .15s ease;
}
.tab-scroll-btn .tsb-circle{
  width:32px; height:32px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  border:1px solid var(--border);
  background:var(--surface); box-shadow:0 2px 10px rgba(15,23,42,.22);
  transition:transform .12s ease, box-shadow .12s ease;
}
.tab-scroll-btn:active .tsb-circle{transform:scale(.9);}
.tab-scroll-btn svg{width:17px; height:17px;}
.tab-scroll-btn svg path{fill:none; stroke:var(--accent); stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round;}
/* Specificity note: these two rules must always beat a later, unconditional
   per-breakpoint `.tab-scroll-btn{width:...}` override (single class) —
   otherwise that override wins by source order and the arrow never
   collapses on that breakpoint. Scoping through .navbar-wrap keeps both
   selectors at 2+ classes so that can't happen regardless of where a
   breakpoint override is declared. */
.navbar-wrap .tab-scroll-left,
.navbar-wrap .tab-scroll-right{width:0; margin:0; pointer-events:none;}
.navbar-wrap.can-scroll-left .tab-scroll-left,
.navbar-wrap.can-scroll-right .tab-scroll-right{width:32px; margin:0 4px; pointer-events:auto;}
@media (max-width:760px){
  .tab-scroll-btn .tsb-circle{box-shadow:0 2px 10px rgba(15,23,42,.3);}
}
nav.tabs button svg{width:18px; height:18px; color:var(--text-muted);}
nav.tabs button[hidden]{display:none !important;}
nav.tabs button svg path, nav.tabs button svg circle, nav.tabs button svg rect{
  fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;
}
nav.tabs button.active{
  color:var(--accent);
  border-bottom-color:var(--accent);
}
nav.tabs button.active svg{color:var(--accent);}
nav.tabs button:hover{color:var(--accent);}
nav.tabs button:hover svg{color:var(--accent);}
.navbar-wrap{
  background:var(--surface); border-bottom:1px solid var(--border);
  box-shadow:0 1px 0 rgba(20,30,70,.02);
}

main{max-width:980px; margin:0 auto; padding:20px 20px 60px;}
.panel{display:none;}
.panel.active{display:block; animation:fade .25s ease;}
@keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

.suggest-embed{position:relative; width:100%; border-radius:14px; overflow:hidden; background:var(--surface-2);}
.suggest-embed iframe{display:block; width:100%; height:600px; border:0;}
@media (max-width:760px){
  .suggest-embed iframe{height:660px;}
}
.suggest-reload-btn{
  display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  margin:12px 0 14px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
  padding:11px 13px; font-size:13.5px; font-weight:600; color:var(--text); cursor:pointer; font-family:inherit;
}
.suggest-reload-btn[hidden]{display:none;}
.suggest-reload-btn:hover{border-color:var(--accent); color:var(--accent);}
.suggest-reload-btn svg{width:15px; height:15px; flex:0 0 auto;}
.suggest-reload-btn svg path{fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}


.section-title{
  font-size:13px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
  color:var(--text-muted); margin:28px 0 12px;
}
.section-title:first-child{margin-top:0;}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media (max-width:640px){.grid2{grid-template-columns:1fr;}}

.card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:16px 18px; box-shadow:var(--shadow);
}

/* dashboard hero */
.hero-grid{display:flex; flex-direction:column; gap:14px;}
.hero-card{
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  padding:20px 22px; box-shadow:var(--shadow); position:relative; overflow:hidden;
}
.hero-card.primary{
  background:
    radial-gradient(1.5px 1.5px at 12% 20%, rgba(255,255,255,.45) 50%, transparent 51%),
    radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,.3) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 55% 15%, color-mix(in srgb, var(--brand-bright) 50%, transparent) 50%, transparent 51%),
    linear-gradient(155deg, var(--ink-950), var(--ink-850));
  color:#fff; border:none;
  display:flex; flex-wrap:wrap; align-items:center; gap:22px;
}
.hero-star-deco{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:190px; height:190px;
  stroke:color-mix(in srgb, var(--brand-bright) 35%, transparent); stroke-width:2; z-index:0; pointer-events:none;
}
.hero-countdown .countdown, .hero-countdown .countdown-label{position:relative; z-index:1;}
.hero-main{position:relative; z-index:1; flex:1; min-width:200px;}
.stat-label{font-size:11.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--brand-blue-bright);}
.hero-card .stat-value{font-size:26px; font-weight:700; margin-top:6px; line-height:1.15; font-family:'Oswald',sans-serif;}
.hero-facts{margin-top:12px; display:flex; flex-direction:column; gap:7px;}
.hero-fact{display:flex; align-items:center; gap:8px; font-size:13.5px; color:#c7cfef;}
.hero-fact svg{width:15px; height:15px; flex:0 0 auto; color:var(--brand-blue-bright);}
.hero-fact svg path, .hero-fact svg circle{fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
.hero-countdown{
  position:relative; z-index:1; text-align:center; padding-left:22px; border-left:1px solid rgba(255,255,255,.18);
  flex:0 0 auto;
}
.countdown{font-size:44px; font-weight:700; font-family:'Oswald',sans-serif; line-height:1;}
.countdown-label{font-size:11px; font-weight:700; letter-spacing:.14em; color:#c7cfef; margin-top:2px;}

/* comp-day "today" treatment */
.today-badge{text-align:center;}
.today-text{
  font-size:14px; font-weight:800; letter-spacing:.1em; margin-top:4px;
  background:linear-gradient(90deg,var(--brand-bright),#fff,var(--brand-bright)); background-size:200% auto;
  -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:hubShimmer 2.5s linear infinite;
}
@keyframes hubShimmer{ to{ background-position:-200% center; } }
.spaceman-wrap{position:relative; width:64px; height:68px; margin:0 auto;}
.spaceman{width:100%; height:100%; object-fit:contain; display:block; animation:hubFloat 2.4s ease-in-out infinite; filter:drop-shadow(0 5px 8px rgba(0,0,0,.45));}
@keyframes hubFloat{
  0%,100%{ transform:translateY(0) rotate(-3deg); }
  50%{ transform:translateY(-7px) rotate(3deg); }
}
.spark{position:absolute; border-radius:50%; background:var(--brand-bright); animation:hubTwinkle 1.6s ease-in-out infinite;}
.spark.s1{width:5px; height:5px; top:0; left:-2px; animation-delay:.1s;}
.spark.s2{width:4px; height:4px; top:8px; right:-4px; animation-delay:.5s;}
.spark.s3{width:3px; height:3px; bottom:4px; left:4px; animation-delay:.9s;}
@keyframes hubTwinkle{
  0%,100%{ opacity:.15; transform:scale(.6); }
  50%{ opacity:1; transform:scale(1.15); }
}
@media (prefers-reduced-motion: reduce){
  .spaceman, .spark, .today-text{animation:none;}
}

/* "today" attention treatment — a due date or event happening today.
   Pure CSS (no new images/gifs) so it stays lightweight. */
@keyframes todayWiggle{
  0%,100%{ transform:rotate(0deg) scale(1); }
  20%{ transform:rotate(-8deg) scale(1.06); }
  40%{ transform:rotate(7deg) scale(1.06); }
  60%{ transform:rotate(-5deg) scale(1.02); }
  80%{ transform:rotate(4deg) scale(1.02); }
}
.coming-row.today .coming-date-block{
  background:var(--danger); border-color:var(--danger);
  animation:todayWiggle 1.6s ease-in-out infinite;
}
.coming-row.today .coming-date-block span,
.coming-row.today .coming-date-block b{ color:#fff; }
.coming-row.today .coming-row-icon{
  display:inline-block; animation:todayWiggle 1.6s ease-in-out infinite;
}
.pay-card.due-today .pay-icon{
  animation:todayWiggle 1.6s ease-in-out infinite;
}
.pay-card.due-today .pay-due{ color:var(--danger); font-weight:700; }
@media (prefers-reduced-motion: reduce){
  .coming-row.today .coming-date-block,
  .coming-row.today .coming-row-icon,
  .pay-card.due-today .pay-icon{ animation:none; }
}

/* payment card */
.pay-card{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  padding:16px 20px; box-shadow:var(--shadow);
}
.pay-icon{
  flex:0 0 auto; width:42px; height:42px; border-radius:11px; background:var(--surface-2);
  display:flex; align-items:center; justify-content:center; font-size:19px;
}
.pay-label{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted);}
.pay-amount{font-size:21px; font-weight:700; font-family:'Oswald',sans-serif; margin-top:2px;}
.pay-due{font-size:12.5px; color:var(--text-muted); line-height:1.5; padding-left:16px; border-left:1px solid var(--border);}
.pay-btn{
  margin-left:auto; background:var(--accent); color:#fff; border:none; border-radius:24px;
  padding:10px 18px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; white-space:nowrap;
}
.pay-btn:hover{filter:brightness(1.08);}
.fee-details{
  flex-basis:100%; margin-top:6px; padding-top:12px; border-top:1px dashed var(--border);
  display:flex; flex-direction:column; gap:6px; max-height:220px; overflow-y:auto;
}
.fee-details .fee-row{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; color:var(--text-muted);}
.fee-details .fee-row b{color:var(--text); font-variant-numeric:tabular-nums; flex:0 0 auto;}

/* Latest Updates — chevron rows w/ solid badge pills */
.feed-item{
  display:flex; align-items:center; gap:12px; padding:13px 2px; border-bottom:1px solid var(--border);
}
.feed-item:last-child{border-bottom:none;}
.feed-date{
  flex:0 0 64px; font-size:11.5px; font-weight:700; color:var(--text-muted); font-variant-numeric:tabular-nums;
  line-height:1.35;
}
.feed-body{flex:1; min-width:0;}
.feed-body b{font-weight:600; font-size:14px;}
.feed-body p{margin:2px 0 0; font-size:13px; color:var(--text-muted);}
.feed-chevron{flex:0 0 auto; color:var(--text-muted); font-size:16px;}
.badge{
  display:inline-block; font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
  padding:3px 8px; border-radius:20px; margin-right:7px; vertical-align:1px;
}
.badge.new{background:var(--accent); color:#fff;}
.badge.event{background:var(--surface-2); color:var(--text-muted); border:1px solid var(--border);}
.badge.practice{background:#f0edff; color:#6552b8;}
.badge.deadline{background:var(--warn-soft); color:var(--warn);}
.badge.fundraiser{background:var(--success-soft); color:var(--success);}
.badge.past{background:var(--surface-2); color:var(--text-muted);}
.badge.today{background:var(--danger-soft); color:var(--danger);}

/* Coming Up — card grid */
.coming-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px;}
.coming-card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:14px; box-shadow:var(--shadow); position:relative;
}
.coming-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
.coming-date{margin-top:8px;}
.coming-month{font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted);}
.coming-day{font-size:26px; font-weight:700; font-family:'Oswald',sans-serif; line-height:1.1;}
.coming-icon{font-size:22px;}
.coming-title{font-weight:700; font-size:14.5px; margin-top:10px; line-height:1.25;}
.coming-meta{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-muted); margin-top:7px;}
.coming-meta svg{width:13px; height:13px; flex:0 0 auto;}
.coming-meta svg path, .coming-meta svg circle{fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}

/* quick links */
.linkrow{display:flex; flex-wrap:wrap; gap:10px;}
.linkbtn{
  display:flex; align-items:center; gap:8px;
  background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
  padding:9px 13px; font-size:13.5px; font-weight:600; text-decoration:none; color:var(--text);
}
.linkbtn:hover{border-color:var(--accent);}
.linkbtn .ico{font-size:15px;}

/* comp cards */
.comp-card{
  border:1px solid var(--border); border-radius:14px; background:var(--surface);
  margin-bottom:12px; box-shadow:var(--shadow); overflow:hidden;
}
.comp-header{
  padding:16px 18px; cursor:pointer; user-select:none;
  display:flex; align-items:flex-start; gap:14px;
}
.comp-datebadge{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  width:58px; flex:0 0 58px; border-radius:12px; padding:8px 2px;
  background:var(--accent-soft); font-family:'Oswald',sans-serif;
}
.comp-datebadge .cdb-mon{font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); display:block;}
.comp-datebadge .cdb-day{font-size:21px; font-weight:700; line-height:1.15; color:var(--accent-ink); font-variant-numeric:tabular-nums; display:block;}
.comp-datebadge .cdb-yr{font-size:10px; color:var(--text-muted); font-weight:600; margin-top:1px; display:block;}
.comp-main{flex:1; min-width:0; padding-top:1px;}
.comp-name{font-size:16px; font-weight:700;}
.comp-loc{font-size:13.5px; color:var(--text-muted); margin-top:3px; display:flex; align-items:flex-start; gap:5px;}
.comp-loc svg{flex:0 0 auto; margin-top:2px;}
.tag-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
.comp-chevron{color:var(--text-muted); align-self:flex-start; transition:transform .2s ease, color .2s ease; margin-top:2px; display:flex;}
.comp-card.open .comp-chevron{transform:rotate(180deg);}
.tag{
  font-size:11px; font-weight:600; letter-spacing:.03em; text-transform:uppercase;
  padding:4px 9px; border-radius:7px; white-space:nowrap; height:fit-content;
}
.tag.local{background:var(--success-soft); color:var(--success);}
.tag.overnight{background:var(--warn-soft); color:var(--warn);}
.tag.required{background:var(--danger-soft); color:var(--danger);}
.comp-details{display:none; padding:12px 18px 16px; border-top:1px dashed var(--border);}
.comp-card.open .comp-details{display:block;}
.travel-detail{
  font-size:13.5px; color:var(--text-muted); line-height:1.6;
}
.travel-detail b{color:var(--text); font-weight:600;}
.travel-detail>div{margin-bottom:7px;}
.travel-detail>div:last-child{margin-bottom:0;}
.travel-detail:empty{display:none; margin:0;}

/* structured detail sections */
.compx-section{padding-top:14px; border-top:1px dashed var(--border); margin-top:14px;}
.comp-details>.compx-section:first-child,
.travel-detail:empty + .compx-section{margin-top:0; padding-top:0; border-top:none;}
.compx-section-label{
  font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted);
  display:flex; align-items:center; gap:6px; margin-bottom:11px;
}
.compx-section-label .cxl-ic{color:var(--accent); display:flex;}
.compx-row{display:flex; align-items:center; gap:12px;}
.compx-row-icon{
  width:34px; height:34px; border-radius:10px; background:var(--accent-soft); color:var(--accent);
  display:flex; align-items:center; justify-content:center; flex:0 0 auto;
}
.compx-row-main{flex:1; min-width:0;}
.compx-row-title{font-size:13.5px; font-weight:600;}
.compx-row-sub{font-size:12.5px; color:var(--text-muted); margin-top:2px; line-height:1.4;}
.compx-row-cta{
  flex:0 0 auto; font-size:12.5px; font-weight:700; color:#fff; background:var(--accent);
  padding:8px 14px; border-radius:9px; text-decoration:none; white-space:nowrap;
}
.compx-row-cta.soon{background:var(--warn-soft); color:var(--warn);}
.compx-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.compx-gcard{
  border:1px solid var(--border); border-radius:12px; padding:12px 13px; display:flex; flex-direction:column; gap:7px;
  text-decoration:none; color:inherit; background:var(--surface);
}
.compx-gcard:hover{border-color:var(--accent); background:var(--accent-soft);}
.compx-gcard .gc-ic{width:26px; height:26px; border-radius:8px; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center;}
.compx-gcard .gc-lbl{font-size:12.5px; font-weight:700; line-height:1.25;}
.compx-gcard .gc-sub{font-size:11px; color:var(--accent); font-weight:600;}
.compx-gcard.soon .gc-ic{background:var(--warn-soft); color:var(--warn);}
.compx-gcard.soon .gc-sub{color:var(--text-muted); font-weight:500;}
.compx-gcard.soon:hover{border-color:var(--border); background:var(--surface);}
.compx-toggle-row{display:flex; align-items:center; justify-content:space-between; gap:14px;}
.compx-toggle-row+.compx-toggle-row{margin-top:14px;}
.compx-toggle-copy{flex:1; min-width:0;}
.compx-toggle-title{font-size:13.5px; font-weight:600;}
.compx-toggle-sub{font-size:12px; color:var(--text-muted); margin-top:2px; line-height:1.4;}
.compx-seg{display:inline-flex; border:1px solid var(--border); border-radius:10px; overflow:hidden; flex:0 0 auto;}
.compx-seg button{border:none; background:var(--surface); padding:7px 15px; font-size:12.5px; font-weight:700; color:var(--text-muted); cursor:pointer; font-family:inherit;}
.compx-seg button.active{background:var(--accent); color:#fff;}
.compx-travel-detail{display:none; margin-top:10px; flex-direction:column; gap:8px;}
.compx-travel-detail.show{display:flex;}
.compx-travel-detail input{
  font-size:12.5px; padding:8px 10px; border-radius:8px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--text); font-family:inherit; width:100%;
}

/* practice cards */
.day-pill{
  display:inline-block; font-weight:700; font-size:12.5px;
  background:var(--accent-soft); color:var(--accent); padding:3px 9px; border-radius:7px;
}
.practice-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px;}
.practice-card{background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:14px; overflow:hidden; display:flex; flex-direction:column;}
.practice-head{display:flex; align-items:center; gap:5px; margin-bottom:2px; flex-wrap:nowrap;}
.day-pill{flex-shrink:0; padding:3px 7px;}
.practice-time{font-size:11.5px; color:var(--text-muted); font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
.practice-extra{font-size:11.5px; color:var(--text-muted); line-height:1.35; margin:2px 0 4px; min-height:2.7em;}
.practice-bow-note{font-size:11.5px; color:var(--text-muted); text-align:center; margin-top:7px;}
.practice-full-img{width:60%; max-width:150px; margin:0 auto; border-radius:10px; display:block;}

/* booking tracker (comp schedule) */
.booking-tracker{grid-column:1/-1; margin-top:10px; padding-top:12px; border-top:1px dashed var(--border); display:flex; flex-direction:column; gap:8px;}
.booking-row{display:flex; flex-wrap:wrap; align-items:center; gap:8px; font-size:13px;}
.booking-check-label{display:flex; align-items:center; gap:6px; font-weight:600; white-space:nowrap; cursor:pointer;}
.booking-check-label input{
  appearance:none; -webkit-appearance:none; width:16px; height:16px; flex:0 0 auto;
  border:1.5px solid #c7cdd6; border-radius:4px; background:#fff; cursor:pointer; position:relative;
}
.booking-check-label input:checked{border-color:#9aa2b1; background:#fff;}
.booking-check-label input:checked::after{
  content:''; position:absolute; left:4px; top:1px; width:4px; height:8px;
  border:solid #667085; border-width:0 2px 2px 0; transform:rotate(45deg);
}
.booking-link-input{flex:1; min-width:140px; font-size:12.5px; padding:6px 9px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-family:inherit;}
.booking-link-view{font-size:12.5px; font-weight:600; white-space:nowrap;}
.cal-add-row{margin-top:10px; padding-top:12px; border-top:1px dashed var(--border); font-size:13.5px; font-weight:600;}
.cal-add-row a{font-weight:700;}
.cal-note{font-size:11.5px; font-weight:400; color:var(--text-muted); margin-top:5px; line-height:1.5;}

.expand-collapse-ctrl{
  text-transform:none; letter-spacing:0; font-weight:500; flex:0 0 auto;
  font-size:11.5px; color:var(--text-muted);
}
.expand-collapse-ctrl a{color:var(--text-muted); text-decoration:none; margin-left:10px;}
.expand-collapse-ctrl a:first-child{margin-left:0;}
.expand-collapse-ctrl a:hover{color:var(--accent); text-decoration:underline;}

/* segmented toggle (checklist view) */
.seg-toggle{display:inline-flex; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:3px; margin-bottom:14px; gap:2px;}
.seg-btn{border:none; background:transparent; font-family:inherit; font-size:13px; font-weight:600; padding:7px 14px; border-radius:8px; color:var(--text-muted); cursor:pointer;}
.seg-btn.active{background:var(--surface); color:var(--accent); box-shadow:var(--shadow);}

/* uniform/swag */
.item-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--border); font-size:14px;}
.item-row:last-child{border-bottom:none;}
.item-row .price{font-weight:700; font-variant-numeric:tabular-nums;}
.req-yes{color:var(--danger); font-weight:600; font-size:12px;}
.req-no{color:var(--text-muted); font-size:12px;}

/* travel checklist */
.chk-cat{font-size:13px; font-weight:700; color:var(--text); margin:20px 4px 8px;}
.chk-cat:first-child{margin-top:0;}
.chk-card{background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); overflow:hidden;}
.chk-row{display:flex; align-items:center; gap:12px; padding:11px 16px; border-bottom:1px solid var(--border); cursor:pointer;}
.chk-row:last-child{border-bottom:none;}
.chk-row input{
  appearance:none; -webkit-appearance:none; width:18px; height:18px; flex:0 0 auto;
  border:1.5px solid #c7cdd6; border-radius:5px; background:#fff; cursor:pointer; position:relative;
}
.chk-row input:checked{border-color:#9aa2b1; background:#fff;}
.chk-row input:checked::after{
  content:''; position:absolute; left:5px; top:1px; width:5px; height:9px;
  border:solid #667085; border-width:0 2px 2px 0; transform:rotate(45deg);
}
.chk-emoji{font-size:18px; flex:0 0 auto; width:24px; text-align:center;}
.chk-label{font-size:14px; flex:1;}
.chk-row.done .chk-label{color:var(--text-muted); text-decoration:line-through;}
.chk-progress{font-size:12.5px; color:var(--text-muted); margin:10px 4px 0; text-align:right;}
.linkline{font-size:13.5px; margin-top:8px;}
.linkline a{font-weight:600;}
.tocome{font-size:13px; color:var(--warn); background:var(--warn-soft); padding:8px 12px; border-radius:9px; margin-top:10px; display:inline-block;}

.checklist-flatlays{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin-bottom:22px;}
.checklist-flatlays img{width:100%; max-width:420px; display:block; margin:0 auto; border-radius:12px; box-shadow:var(--shadow);}

/* photos */
.photo-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px;}
.photo-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; box-shadow:var(--shadow); cursor:pointer;}
.photo-card img{width:100%; aspect-ratio:1/1; object-fit:cover; display:block; transition:transform .2s ease;}
.photo-card:hover img{transform:scale(1.04);}
.lightbox{
  display:none; position:fixed; inset:0; background:rgba(5,8,15,.92); z-index:200;
  align-items:center; justify-content:center; padding:40px 20px; cursor:zoom-out;
}
.lightbox.open{display:flex;}
.lightbox img{max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,.5); cursor:default;}
.lightbox-close{
  position:absolute; top:18px; right:20px; background:rgba(255,255,255,.12); border:none; color:#fff;
  width:38px; height:38px; border-radius:50%; font-size:18px; cursor:pointer; z-index:1;
}
.lightbox-close:hover{background:rgba(255,255,255,.22);}

/* fundraiser cards */
.fund-card{display:flex; gap:14px; padding:14px 0; border-bottom:1px solid var(--border);}
.fund-card:last-child{border-bottom:none;}
.fund-emoji{font-size:28px; flex:0 0 auto;}
.fund-title{font-weight:700; font-size:15px;}
.fund-meta{font-size:13px; color:var(--text-muted); margin-top:2px; line-height:1.5;}

/* contacts */
.contact-card{
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding:12px 0; border-bottom:1px solid var(--border);
}
.contact-card:last-child{border-bottom:none;}
.contact-name{font-weight:700; font-size:14.5px;}
.contact-role{font-size:12.5px; color:var(--text-muted);}
.contact-way{font-size:13.5px; text-align:right; color:var(--text);}

/* student standouts */
.standout-pill{grid-column:1/-1; justify-content:flex-start;}
.standout-pill b{font-weight:700;}

/* faq accordion */
.faq-item{border-bottom:1px solid var(--border);}
.faq-item:last-child{border-bottom:none;}
.faq-q{
  width:100%; text-align:left; background:none; border:none; cursor:pointer;
  padding:14px 4px; font-size:14.5px; font-weight:600; color:var(--text);
  display:flex; justify-content:space-between; align-items:center; gap:10px;
}
.faq-q .plus{color:var(--accent); font-size:18px; font-weight:400; transition:transform .2s;}
.faq-item.open .plus{transform:rotate(45deg);}
.faq-a{max-height:0; overflow:hidden; transition:max-height .3s ease;}
.faq-item.open .faq-a{max-height:2400px;}
.faq-a-inner{margin:0 4px 14px; font-size:13.5px; color:var(--text-muted); line-height:1.6;}
.faq-a-inner p{margin:0 0 12px;}
.faq-a-inner p:last-child{margin-bottom:0;}
.faq-a-inner ul{margin:0 0 4px; padding-left:18px; list-style:disc;}
.faq-a-inner ul ul{margin:6px 0 8px; padding-left:18px;}
.faq-a-inner li{margin-bottom:9px;}
.faq-a-inner li:last-child{margin-bottom:0;}
.faq-a-inner a{color:var(--accent); font-weight:600; text-decoration:none;}
.faq-a-inner a:hover{text-decoration:underline;}
.faq-a-inner .faq-price{color:var(--text); font-weight:700;}
.faq-a-inner .faq-desc{display:block; color:var(--text-muted); font-size:12.5px; margin-top:2px;}

.note{
  font-size:13px; color:var(--text-muted); background:var(--surface-2);
  border-radius:10px; padding:11px 14px; line-height:1.55; margin-top:14px;
}
.note b{color:var(--text);}

.practice-banner{
  display:flex; align-items:flex-start; gap:10px;
  background:var(--accent-soft); border:1px solid var(--accent); border-radius:12px;
  padding:12px 14px; margin-bottom:16px; font-size:13.5px; color:var(--accent-ink); line-height:1.55;
}
.practice-banner + .practice-banner{margin-top:-6px;}
.practice-banner .banner-ic{flex:0 0 auto; width:19px; height:19px; margin-top:1px; color:var(--accent);}
.practice-banner .banner-ic svg{width:100%; height:100%;}
.practice-banner b{color:var(--accent-ink);}



/* =========================================================
   TEAM HUB — polished parent-app redesign
   Keeps all existing data + functionality, replaces visual system.
   ========================================================= */
:root,
:root[data-theme="dark"]{
  --bg:#f7f8fb;
  --surface:#ffffff;
  --surface-2:#f1f3f8;
  --border:#e3e6ee;
  --text:#111521;
  --text-muted:#667085;
  --accent:var(--brand);
  --accent-ink:var(--brand-ink);
  --accent-soft:var(--brand-tint);
  --warn:#a56308;
  --warn-soft:#fff1d8;
  --danger:#b4233f;
  --danger-soft:#ffe9ee;
  --success:#147a52;
  --success-soft:#e5f7ef;
  --shadow:0 10px 30px rgba(15,23,42,.07),0 2px 6px rgba(15,23,42,.04);
  --ink-950:#05070b;
  --ink-850:#0c1420;
  --brand-blue:var(--brand);
  --brand-blue-bright:var(--brand-bright);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#f7f8fb;--surface:#fff;--surface-2:#f1f3f8;--border:#e3e6ee;
    --text:#111521;--text-muted:#667085;--accent:var(--brand);--accent-ink:var(--brand-ink);
    --accent-soft:var(--brand-tint);--shadow:0 10px 30px rgba(15,23,42,.07),0 2px 6px rgba(15,23,42,.04);
  }
}
html{background:#f7f8fb;}
body{background:linear-gradient(180deg,#f7f8fb 0,#fff 420px);font-size:15px;}
a{text-underline-offset:2px;}












.navbar-wrap{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);box-shadow:0 1px 0 rgba(15,23,42,.06);}
nav.tabs{justify-content:center;gap:4px;padding:0 8px;}
nav.tabs button{min-width:80px;height:60px;color:#667085;font-size:11px;padding:11px 12px 10px;border-bottom-width:3px;transition:.18s ease;}

nav.tabs button:hover{background:#f6f8fb;color:#111521;}
nav.tabs button.active{color:var(--brand-deep);border-bottom-color:var(--brand);background:linear-gradient(180deg,transparent 0,var(--brand-tint) 100%);}

main{max-width:1040px;padding:30px 24px 72px;}

.coming-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;}

.coming-day{font-size:34px;}

.comp-card{border-radius:18px;}

/* refinements from parent feedback */

/* Comp status palette: cool blue / lavender / fresh green instead of muddy warning tones */

.tag.overnight{background:#f0edff;color:#6552b8;border:1px solid #e1dcff;}

/* Comps other teams attend that this team doesn't */
.comp-card.not-attending{background:#f6f7f9;box-shadow:none;}
.comp-card.not-attending .comp-header:hover{background:#eef0f3;}

@media (max-width:760px){
  /* On a short tab (little content) the page itself can end up shorter than
     the screen. Mobile Safari has a known quirk where a `position:fixed`
     element on a page shorter than the viewport can anchor to the bottom of
     the page's own content instead of the true screen edge — which looks
     exactly like the nav sliding up on tabs with less content. Forcing the
     page to always be at least one full screen tall removes that ambiguity:
     there's always more content than the viewport, so the browser always has
     a real, viewport-sized box to fix the nav against. min-height (not
     height) means a tall tab still grows and scrolls normally. */
  html, body{min-height:100%;}
  body{min-height:100vh; min-height:100dvh;}
  
  
  
  main{padding:18px 14px calc(92px + env(safe-area-inset-bottom));}
  .section-title{font-size:16px;margin-top:26px;}
  .hero-card.primary{min-height:210px;padding:22px 20px;gap:16px;}
  .hero-card .stat-value{font-size:30px;}
  .hero-countdown{min-width:100px;padding-left:16px;}.countdown{font-size:54px;}
  .coming-grid{grid-template-columns:1fr;}
  .coming-row{padding:14px 14px;gap:13px;min-height:92px;}
  .coming-date-block{width:54px;min-width:54px;height:60px;}
  .coming-row-title{font-size:16px;}
  .comp-expand{gap:0;}
  .pay-card{align-items:flex-start;}
  .pay-due{border-left:0;padding-left:0;flex-basis:100%;margin-left:62px;margin-top:-8px;}
  .pay-btn{margin-left:62px;}
  /* Bottom nav: pinned directly to the true bottom edge of the screen with
     position:fixed, so there is no way for it to leave a gap underneath —
     it is glued to bottom:0 no matter what. `main`'s bottom padding above
     clears the nav's own fixed height so content never hides behind it. */
  .navbar-wrap{
    position:fixed; top:auto; left:0; right:0; bottom:0; z-index:100;
    border-top:1px solid #e4e7ec;border-bottom:0;box-shadow:0 -8px 22px rgba(15,23,42,.07);
    background:rgba(255,255,255,.98); backdrop-filter:blur(14px);
    padding-bottom:max(10px, env(safe-area-inset-bottom));
  }
  nav.tabs{justify-content:flex-start;padding:0 4px;}
  nav.tabs button{min-width:68px;height:51px;font-size:9.5px;padding:8px 8px 7px;border-bottom:0;border-top:3px solid transparent;}
  nav.tabs button.active{border-top-color:var(--brand);border-bottom-color:transparent;background:var(--brand-tint);}
  nav.tabs button svg{width:18px;height:18px;}
}

/* ---- v3: status colors + period view ---- */
:root{--st-up:color-mix(in srgb,var(--accent) 42%,var(--surface)); --st-up-soft:var(--accent-soft);}

.bud-key .st-up{background:var(--st-up-soft); color:var(--st-up);}

/* ---- v4: aligned grid rows, receipt scan, mileage calculator, category budgets ---- */
.bud-item{display:grid; grid-template-columns:78px minmax(0,1fr) auto 28px 28px; grid-template-areas:"d l a e x" "p l a e x"; column-gap:6px; row-gap:3px; align-items:center; padding-top:9px; padding-bottom:9px;}

.bud-item em.st-est{background:var(--warn-soft); color:var(--warn);}

function hex2rgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function rgb2hex(a){return '#'+a.map(function(v){return Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0');}).join('');}
function mix(a,b,t){var x=hex2rgb(a),y=hex2rgb(b);return rgb2hex([x[0]+(y[0]-x[0])*t,x[1]+(y[1]-x[1])*t,x[2]+(y[2]-x[2])*t]);}
function theme(key){

  var v={'--brand':B,'--brand-deep':mix(B,'#000000',.22),'--brand-ink':mix(B,'#000000',.82),'--brand-bright':mix(B,'#ffffff',.42),'--brand-light':mix(B,'#ffffff',.5),'--on-dark':mix(B,'#ffffff',.55),'--brand-line':mix(B,'#ffffff',.86),'--brand-tint':mix(B,'#ffffff',.93),'--hero-1':mix(D,'#000000',.45),'--hero-2':D,'--hero-3':mix(D,B,.22),'--accent':B,'--accent-ink':mix(B,'#000000',.82),'--accent-soft':mix(B,'#ffffff',.91),'--brand-blue':B,'--brand-blue-bright':mix(B,'#ffffff',.42),'--cal-comp':B,'--ink-950':mix(D,'#000000',.55),'--ink-850':mix(D,'#000000',.2)};
  Object.keys(v).forEach(function(k){r.style.setProperty(k,v[k]);});

  if(key==='all'){r.style.setProperty('--hero-1','#3566dc');r.style.setProperty('--hero-2','#4d7fe8');r.style.setProperty('--hero-3','#6e9af0');}
}

function conflictFor(e){return conflicts().filter(function(p){return p[0]===e||p[1]===e;})[0];}
function nextEvent(){return events.filter(function(e){return inKid(e)&&e.end>=todayS;}).sort(function(a,b){return a.start<b.start?-1:1;})[0];}
function dayLabel(ds){var n=Math.round((parse(ds)-todayD)/864e5);return n===0?'Today':n===1?'Tomorrow':fmt(ds);}
var IC={cal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>',pin:'<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>',plane:'<svg viewBox="0 0 24 24"><path d="M3 13l7-2 5-9 1.5.6-3 8.9 6 1.7-1 2-6.3-1-3.6 5.4-2 .5.6-3.6z"></path></svg>'};

function heroHtml(){
  var n=nextEvent(); if(!n) return '';

  return '<div class="hero-grid"><div class="hero-card primary"><div class="hero-main"><div class="stat-label">Next Competition</div><div class="stat-value">'+n.n+'</div>'+
    (S.kid==='all'?'<span class="hero-who" style="--c:'+k.color+'"><span class="av">'+k.name[0]+'</span>'+k.name+' · '+k.team+'</span>':'')+
    '<div class="hero-facts"><div class="hero-fact">'+IC.cal+fmt(n.start,{month:'short',day:'numeric',year:'numeric'})+(n.end!==n.start?' – '+fmt(n.end,{day:'numeric'}):'')+'</div><div class="hero-fact">'+IC.pin+n.loc+'</div><div class="hero-fact">'+IC.plane+(n.trip==='fly'?'Flying'+(n.flight?' · flight booked':' · flight not booked'):'Driving, local')+'</div></div></div>'+
    '<div class="hero-countdown"><div class="countdown">'+days+'</div><div class="countdown-label">DAY'+(days===1?'':'S')+'</div></div></div></div>';
}
function conflictHtml(){
  var ps=conflicts(), comps=[];
  ps.forEach(function(p){
    var hit=comps.filter(function(c){return c.ev.indexOf(p[0])>=0||c.ev.indexOf(p[1])>=0;});
    var c=hit[0]||{ev:[]}; if(!hit.length)comps.push(c);
    hit.slice(1).forEach(function(h){h.ev.forEach(function(e){if(c.ev.indexOf(e)<0)c.ev.push(e);});comps.splice(comps.indexOf(h),1);});
    p.forEach(function(e){if(c.ev.indexOf(e)<0)c.ev.push(e);});
  });
  return comps.filter(function(c){return S.kid==='all'||c.ev.some(function(e){return e.k===S.kid;});}).map(function(c){
    var s=c.ev.map(function(e){return e.start;}).sort()[0], en=c.ev.map(function(e){return e.end;}).sort().pop();
    var rows=grp(c.ev,function(e){return e.n+'|'+e.loc;}).map(function(g){return '<div class="who" '+cvm(g.ks)+'><i></i>'+whoList(g.ks)+': '+g.e.n+', '+g.e.loc+'</div>';}).join('');
    return '<div class="mt-alert"><b>Two places, one weekend</b><p>'+fmt(s,{month:'short',day:'numeric'})+(en!==s?'–'+fmt(en,{day:'numeric'}):'')+'. Someone needs a plan for who goes where.</p>'+rows+(planGet(s+'|'+en)?'<div class="mt-note-box">'+planGet(s+'|'+en).replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</div>':'')+'<button class="mt-ghost" type="button" data-act="plan" data-pk="'+s+'|'+en+'">'+(planGet(s+'|'+en)?'Edit plan':'Note who is going with whom')+'</button></div>';
  }).join('');
}
function grp(list,keyf){var m={},o=[];list.forEach(function(x){var key=keyf(x);if(!m[key]){m[key]={e:x,ks:[]};o.push(m[key]);}if(m[key].ks.indexOf(x.k)<0)m[key].ks.push(x.k);});return o;}
function whoList(ks){return ks.map(function(k){return kidBy(k).name;}).join(', ');}
function cvm(ks){return ks.length>1?'style="--c:#3d6fe0"':cv(ks[0]);}
function weekHtml(){
  var items=[]; for(var i=0;i<7;i++){var d=dayOffset(i),ds=iso(d);
    kids.forEach(function(k){if(!inKid({k:k.id}))return;k.practice.forEach(function(p){if(p.d===d.getDay())items.push({date:ds,k:k.id,t:p.t,n:'Practice',sub:k.team});});});
    events.forEach(function(e){if(inKid(e)&&e.start<=ds&&ds<=e.end)items.push({date:ds,k:e.k,t:'All day',n:e.n,sub:e.loc});});}
  if(!items.length) return '<p class="bud-empty">Nothing on this week.</p>';
  var g=grp(items,function(i){return i.date+'|'+i.n+'|'+i.t+'|'+(i.n==='Practice'?i.k:'')}).map(function(x){x.e.ks=x.ks;return x.e;});
  var by={};g.forEach(function(i){(by[i.date]=by[i.date]||[]).push(i);});
  return Object.keys(by).sort().map(function(ds){return '<div class="mt-day">'+dayLabel(ds)+'</div>'+by[ds].map(function(i){
    return '<div class="mt-row" '+cvm(i.ks)+'><span class="mt-bar"></span><span class="mt-time">'+i.t+'</span><div class="main"><div class="t">'+i.n+'</div><div class="s">'+(S.kid==='all'?whoList(i.ks)+' · ':'')+(i.n==='Practice'?i.sub:i.sub)+'</div></div></div>';}).join('');}).join('');
}
function paysHtml(){

function tripsHtml(){

function schedule(){
  var list=grp(events.filter(inKid).filter(function(e){return e.end>=todayS;}).sort(function(a,b){return a.start<b.start?-1:1;}),function(e){return e.n+'|'+e.start;}), out='', last='';
  list.forEach(function(g){
    var e=g.e, ks=g.ks;
    var mon=parse(e.start).toLocaleDateString('en-US',{month:'long',year:'numeric'});
    if(mon!==last){ if(last) out+='</div>'; out+='<div class="section-title">'+mon+'</div><div class="card">'; last=mon; }
    var cf=ks.length===1?conflictFor(e):null, o=cf?(cf[0]===e?cf[1]:cf[0]):null, d=parse(e.start);
    out+='<div class="mt-row" '+cvm(ks)+'><div class="mt-date"><b>'+d.getDate()+'</b><span>'+d.toLocaleDateString('en-US',{month:'short'})+'</span></div><div class="main"><div class="t">'+e.n+'</div><div class="s">'+(S.kid==='all'?whoList(ks)+' · ':'')+e.loc+(e.end!==e.start?' · '+fmt(e.start,{month:'short',day:'numeric'})+'–'+fmt(e.end,{day:'numeric'}):'')+'</div><div class="mt-pills">'+

function calItems(ds){
  var out=[], d=parse(ds);
  kids.forEach(function(k){if(S.kid!=='all'&&k.id!==S.kid)return;
    k.practice.forEach(function(p){if(p.d===d.getDay()&&ds>=todayS)out.push({k:k.id,n:'Practice',sub:p.r,kind:'p'});});
    events.forEach(function(e){if(e.k===k.id&&e.start<=ds&&ds<=e.end)out.push({k:k.id,n:e.n,sub:e.loc,kind:'c'});});
    TEAMDATA[k.id].events.forEach(function(e){if(iso(dayOffset(e.d))===ds)out.push({k:k.id,n:e.n,sub:e.meta,kind:'e'});});
  });
  return out.sort(function(a,b){return a.kind<b.kind?-1:1;});
}

function showFrames(){
  var fr=document.getElementById('frames');
  if(S.kid==='all'){fr.hidden=true;}
  else{fr.hidden=false;frameFor(kidBy(S.kid));Object.keys(S.frames).forEach(function(id){S.frames[id].hidden=(id!==S.kid);});sizeFrames();}
}
window.addEventListener('resize',function(){if(S.kid!=='all')sizeFrames();});
function openChildTab(id,tab){
  var k=kidBy(id); S.kid=id; render(); window.scrollTo(0,0);
  var f=S.frames[id];
  function go(){try{var b=f.contentDocument.querySelector('#tabs button[data-tab="'+tab+'"]'); if(b){b.hidden=false; b.click();}}catch(e){}}
  if(f.contentDocument&&f.contentDocument.readyState==='complete'&&f.contentDocument.querySelector('#tabs')) go(); else f.addEventListener('load',function(){setTimeout(go,150);},{once:true});
}
function render(){
  theme(S.kid);
  var k=S.kid==='all'?null:kidBy(S.kid);
  document.body.classList.toggle('kid-mode',!!k);
  document.getElementById('mtSub').textContent=kids.length?'Family hub · '+kids.length+(kids.length===1?' team':' teams'):'Family hub';
  document.body.classList.toggle('no-kids',!kids.length);
  var sw=!kids.length?'':'<button class="mt-chip'+(S.kid==='all'?' on':'')+'" role="tab" aria-selected="'+(S.kid==='all')+'" data-kid="all"><span class="stack">'+kids.slice(0,3).map(function(x,i){return '<i style="left:'+(i*6)+'px;--c:'+x.color+'"></i>';}).join('')+'</span><span class="nm">All</span></button>';
  kids.forEach(function(x){sw+='<button class="mt-chip'+(S.kid===x.id?' on':'')+'" role="tab" aria-selected="'+(S.kid===x.id)+'" data-kid="'+x.id+'" '+cv(x.id)+'><span class="av">'+x.name[0]+'</span><span class="nm">'+x.name+'</span></button>';});
  sw+='<button class="mt-chip mt-plus" type="button" id="addTeamBtn" aria-label="Add a team"><span class="nm">+</span></button>';
  document.getElementById('sw').innerHTML=sw;
  showFrames();
  document.getElementById('tabs').innerHTML=TABS.map(function(t){return '<button type="button" data-tab="'+t[0]+'" class="'+(S.tab===t[0]?'active':'')+'"><svg viewBox="0 0 24 24">'+t[2]+'</svg>'+t[1]+'</button>';}).join('');
  if(!kids.length){document.getElementById('mtMain').innerHTML=welcome();}
  else if(!k) document.getElementById('mtMain').innerHTML=({home:home,schedule:schedule,practice:practiceTab,fundraisers:eventsTab,calendar:calendarTab,checklist:packingTab,faq:faqTab,budget:moneyScreen})[S.tab]();
  var act=document.querySelector('#tabs button.active'); if(act&&act.scrollIntoView) { try{ act.parentElement.scrollLeft=act.offsetLeft-20; }catch(e){} }
  renderSheet();
}
function renderSheet(){
  var sh=document.getElementById('sheet'), b=document.getElementById('sheetBody');
  if(!S.sheet){sh.hidden=true;document.body.style.overflow='';return;}
  sh.hidden=false; document.body.style.overflow='hidden';
  var close='<button class="mt-x" type="button" data-act="close">Close</button>';
  var cols=EXTRA.map(function(e){return e.B;});
  if(S.sheet==='team'){
    b.innerHTML=close+'<h2>Add a family member</h2><p>Choose the team they are on. Each team keeps its own hub up to date, so nothing is copied over.</p><div class="exp-grid"><label>Team<select class="cal-input" style="margin-top:0" id="teamPick">'+TEAMOPTS.map(function(o){return '<option value="'+o.key+'"'+(S.newTeam===o.key?' selected':'')+'>'+o.label+'</option>';}).join('')+'</select></label><label>Their first name<input class="cal-input" style="margin-top:0" id="kidName" maxlength="20" placeholder="First name" value="'+S.newName+'" autocomplete="off"></label></div><div class="exp-actions" style="margin-top:16px"><button class="pay-btn" type="button" data-act="addkid">Add to The App</button></div>'+
      (kids.length?'<div style="margin-top:22px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)">Your family</div>'+kids.map(function(x){return '<div class="mt-fam" '+cv(x.id)+'><span class="av">'+x.name[0]+'</span><span class="nm">'+x.name+'<span>'+x.team+'</span></span><button type="button" data-act="rmkid" data-id="'+x.id+'">Remove</button></div>';}).join(''):'');
  } else if(S.sheet==='expense'){
    b.innerHTML=close+'<h2>Add an expense</h2><div class="exp-grid">'+(S.kid==='all'?'<div style="font-weight:700;font-size:13px">For which kid?</div><div class="mt-sw" style="margin:0">'+kids.map(function(x){return '<button class="mt-chip'+(S.expKid===x.id?' on':'')+'" style="--c:'+x.color+';color:var(--text);background:var(--surface-2);border-color:var(--border)'+(S.expKid===x.id?';background:var(--text);color:var(--surface)':'')+'" type="button" data-expkid="'+x.id+'"><span class="av">'+x.name[0]+'</span>'+x.name+'</button>';}).join('')+'</div>':'')+
      '<label>What was it?<input class="cal-input" style="margin-top:0" id="expNote" placeholder="e.g. Team bow, snacks, parking"></label><label>Amount<input class="cal-input" style="margin-top:0" id="expAmt" inputmode="decimal" placeholder="$0.00"></label></div><div class="exp-actions" style="margin-top:16px"><button class="pay-btn" type="button" data-act="saveexp">Save</button></div>';
  } else {
    var pl=planGet(S.planKey);
    b.innerHTML=close+'<h2>Who is going where?</h2><p>Jot down which parent takes which child. It is saved on this device and shows on the card.</p><div class="exp-grid"><label>Plan<textarea class="cal-input" style="margin-top:0;min-height:96px" id="planTxt" maxlength="300" placeholder="e.g. Mom takes Maya to Anaheim, Dad takes Eli to Orlando">'+pl.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</textarea></label></div><div class="exp-actions" style="margin-top:16px"><button class="pay-btn" type="button" data-act="saveplan">Save</button></div>';
  }
}

var FAMKEY='thehub_family_v1';
function cleanName(s){return String(s||'').replace(/[<>&"'`\\]/g,'').replace(/\s+/g,' ').trim().slice(0,20);}
function addMember(teamKey,name,id){
  var o=TEAMOPTS.filter(function(x){return x.key===teamKey;})[0]; if(!o)return null;
  var src=TPLK.filter(function(x){return x.id===o.tpl;})[0], nk=JSON.parse(JSON.stringify(src));
  nk.id=id; nk.name=name; nk.teamKey=teamKey; kids.push(nk); BRANDS[id]={B:nk.accent,D:nk.dark};
  TPLE.filter(function(e){return e.k===o.tpl;}).forEach(function(e){var c=JSON.parse(JSON.stringify(e));c.k=id;events.push(c);});
  TPLP.filter(function(p){return p.k===o.tpl;}).forEach(function(p){var c=JSON.parse(JSON.stringify(p));c.k=id;pays.push(c);});
  TEAMDATA[id]=JSON.parse(JSON.stringify(TPLD[o.tpl]));
  return nk;
}
function removeMember(id){
  kids=kids.filter(function(k){return k.id!==id;}); events=events.filter(function(e){return e.k!==id;}); pays=pays.filter(function(p){return p.k!==id;}); delete TEAMDATA[id];
  if(S.frames[id]){S.frames[id].remove();delete S.frames[id];}
  try{Object.keys(localStorage).forEach(function(k){if(k.indexOf(id+':')===0)localStorage.removeItem(k);});}catch(e){}
}
function saveFamily(){try{localStorage.setItem(FAMKEY,JSON.stringify(kids.map(function(k){return {id:k.id,name:k.name,team:k.teamKey};})));}catch(e){}}
function loadFamily(){var l=[];try{l=JSON.parse(localStorage.getItem(FAMKEY)||'[]')||[];}catch(e){}l.forEach(function(x){if(x&&x.id&&/^[a-z0-9]+$/.test(x.id))addMember(x.team,cleanName(x.name)||'Child',x.id);});}
function planAll(){try{return JSON.parse(localStorage.getItem('thehub_plans_v1')||'{}')||{};}catch(e){return {};}}
function planGet(k){return planAll()[k]||'';}
function welcome(){return '<div class="card mt-welcome"><h2>Welcome to The App</h2><p>One place for every child\'s team. Pick a team and add your child to see their schedule, practice wear, packing list and budget. Add more kids any time and switch between them at the top.</p><button class="pay-btn" type="button" data-act="openadd">Add a family member</button></div>';}
loadFamily();
document.addEventListener('click',function(e){
  if(e.target.closest('#addTeamBtn')){S.sheet='team';S.found=false;render();return;}
  var t=e.target.closest('[data-open],[data-kid],[data-tab],[data-act],[data-color],[data-expkid],[data-day],[data-calnav],[data-chk],[data-faq]');
  if(e.target.id==='sheet'){S.sheet=null;S.found=false;render();return;}
  if(!t) return;
  if(t.dataset.open){var q=t.dataset.open.split(':');openChildTab(q[0],q[1]);return;}
  if(t.dataset.day){S.sel=t.dataset.day;render();return;}
  if(t.dataset.calnav){S.cal+=+t.dataset.calnav;render();return;}
    if(t.dataset.faq){S.faq[t.dataset.faq]=!S.faq[t.dataset.faq];render();return;}
  if(t.dataset.act==='close'){S.sheet=null;S.found=false;render();return;}
  if(t.dataset.expkid){S.expKid=t.dataset.expkid;render();return;}
  if(t.dataset.color!==undefined){var n=document.getElementById('kidName');S.newName=n?n.value:S.newName;S.newColor=+t.dataset.color;render();return;}
  if(t.dataset.kid){S.kid=t.dataset.kid;if(t.dataset.from==='money')S.tab='budget';render();window.scrollTo(0,0);return;}
  if(t.dataset.tab){S.tab=t.dataset.tab;render();window.scrollTo(0,0);return;}
  var a=t.dataset.act;
  if(a==='find'){S.found=true;render();}
  else if(a==='addkid'){
    var nm=cleanName(document.getElementById('kidName').value)||'Child', key=document.getElementById('teamPick').value, id='f'+Date.now().toString(36)+Math.floor(Math.random()*36).toString(36);
    if(addMember(key,nm,id)){saveFamily();}
    S.sheet=null;S.newName='';S.kid=id;S.tab='home';render();window.scrollTo(0,0);
  }
  else if(a==='rmkid'){
    var rid=t.dataset.id, rk=kidBy(rid);
    if(rk&&confirm('Remove '+rk.name+' from The App? Their saved checklist, calendar items and budget on this device will be erased.')){removeMember(rid);saveFamily();if(S.kid===rid)S.kid='all';render();}
  }
  else if(a==='openadd'){S.sheet='team';render();}
  else if(a==='saveplan'){var pp=planAll();pp[S.planKey]=(document.getElementById('planTxt').value||'').slice(0,300);try{localStorage.setItem('thehub_plans_v1',JSON.stringify(pp));}catch(e){}S.sheet=null;render();}
  else if(a==='expense'){S.sheet='expense';S.expKid=S.kid==='all'?kids[0].id:S.kid;render();}
  else if(a==='saveexp'){var amt=parseFloat((document.getElementById('expAmt').value||'').replace(/[^0-9.]/g,''))||0,kk=kidBy(S.kid==='all'?S.expKid:S.kid),cat=kk.cats.filter(function(c){return c[0]==='Everything else';})[0];if(amt>0&&cat)cat[1]+=amt;S.sheet=null;S.tab='budget';render();}
  else if(a==='plan'){S.planKey=t.dataset.pk||'';S.sheet='plan';render();}
});
render();
})();

function initDisclaimer(d){
  const root = document.getElementById('appDisclaimer');
  if(!root) return;
  if(d.show === false){ root.remove(); const m = document.getElementById('discModal'); if(m) m.remove(); return; }
  const official = d.type === 'official';
  const sections = [];
  if(!official){
    sections.push(['Independent and unofficial',
      'This app is an independent, unofficial project. It is not made, owned, operated, sponsored, endorsed, reviewed or approved by '+d.entity+', and it has no affiliation, partnership, employment or agency relationship with them or with any of their owners, coaches, staff, athletes or families. Nothing in this app speaks for or binds them.']);
    sections.push(['Who made it', d.about]);
  } else {
    sections.push(['About this app', d.about]);
  }
  sections.push(['Information may be wrong or out of date',
    'Dates, times, fees, locations, links, travel details, policies and everything else shown here are gathered by hand from sources believed to be reliable and may be incomplete, outdated, or mistaken. Nothing here is an official announcement'+(official?' unless '+d.entity+' says so':'')+'. Always confirm directly with '+(official?d.entity:'the gym')+', the event producer, and any hotel, airline or vendor before you book, pay, travel or make any other decision.']);
  sections.push(['No warranty — use at your own risk',
    'This app is provided “as is” and “as available,” without warranties of any kind, express or implied, including accuracy, completeness, timeliness, availability, or fitness for a particular purpose. To the fullest extent permitted by law, '+(official?d.entity+' and the people who built this app':'the creator')+' will not be liable for any direct, indirect, incidental, special or consequential loss or damage — including missed deadlines, bookings, payments or events, fees, travel costs, or any other loss — arising from the use of, or reliance on, this app or any link in it. By using this app you accept these terms; if you do not accept them, please do not use it.']);
  sections.push(['Names, logos and trademarks',
    'All team, gym, event, product, airline, hotel and brand names mentioned are the property of their respective owners and appear only to identify them factually. No ownership of, license to, or endorsement by any of them is claimed or implied.']);
  sections.push(['Your information and privacy',
    'This app has no accounts and does not collect personal information. Things you enter here (such as packing checklists, personal calendar events'+(d.budget?', and budget numbers':'')+') are saved only in your own browser on your own device and are never sent to the creator. They will not carry over to another device and are erased if you clear your browser data. Links lead to third-party websites that have their own terms and privacy policies, and the “Suggest an update” form, if shown, is run by a third-party form provider. This app is intended for parents and guardians and is not directed at children.']);
  if(d.budget){
    sections.push(['Budget tool',
      'The budget tab is a personal record-keeping and estimating aid. Figures are the amounts you enter plus rough estimates built from them (for example, a daily spending allowance or a per-mile rate), and may not match what you actually pay. It is not financial, tax or accounting advice. Prices shown for gym fees or private lessons are only what the app has been given and are not a bill, invoice or price quote.']);
  }
  sections.push(['Corrections and removal',
    'If you are '+(official?'a family member, a vendor, or':'the gym, an event producer, or')+' anyone named or shown in this app and would like something corrected or taken down, please tell '+d.contact+' and it will be reviewed promptly and in good faith.']);

  const shortNote = official
    ? '<p>'+d.shortOfficial+'</p>'
    : '<p>Independent, unofficial app — not affiliated with, endorsed by or sponsored by '+d.shortEntity+'. '+d.shortAbout+' Details may be out of date; always confirm with the gym and the event.</p>';
  root.innerHTML = shortNote + '<button type="button" class="disc-link" id="discOpen">Read the full disclaimer</button>';

  const body = document.getElementById('discBody');
  body.innerHTML = sections.map(s=>'<h3>'+s[0]+'</h3><p>'+s[1]+'</p>').join('') +
    '<p class="disc-date">Last updated '+(d.updated||'')+'</p>';

  const modal = document.getElementById('discModal');
  let lastFocus = null;
  function open(){ lastFocus = document.activeElement; modal.hidden = false; document.body.style.overflow='hidden'; const x=document.getElementById('discClose'); if(x) x.focus(); }
  function close(){ modal.hidden = true; document.body.style.overflow=''; if(lastFocus && lastFocus.focus) lastFocus.focus(); }
  document.getElementById('discOpen').addEventListener('click', open);
  document.getElementById('discClose').addEventListener('click', close);
  modal.addEventListener('click', e=>{ if(e.target === modal) close(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !modal.hidden) close(); });
}
initDisclaimer({"show": true, "type": "independent", "entity": "California All Stars (the “Gym”) or any other gym, club, event producer, league or governing body", "shortEntity": "California All Stars", "about": "This app is a personal passion project, built and maintained on a volunteer basis by a cheer parent and shared by direct link with a small group of team families and friends. It is not a commissioned work, product or service of the Gym, and the creator is not acting as an employee, contractor, agent or representative of the Gym.", "shortAbout": "A passion project by a cheer parent.", "contact": "the person who shared this link with you", "updated": "October 2026", "budget": true});
</script>
